# voyagerota.com, www, docs, app and api on one droplet, installed by deploy/setup.sh
# certbot --nginx adds the https parts to every server block below....

# devices and the dashboard share the api, a misbehaving sketch gets slowed down here first....
limit_req_zone $binary_remote_addr zone=voyager_api:10m rate=10r/s;


server {
    listen 80;
    server_name www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

# landing page....
server {
    listen 80;
    server_name __DOMAIN__;
    root /var/www/voyagerota/current/landing;
    include /etc/nginx/snippets/voyagerota-static.conf;
}

# documentation....
server {
    listen 80;
    server_name docs.__DOMAIN__;
    root /var/www/voyagerota/current/docs;
    include /etc/nginx/snippets/voyagerota-static.conf;
}

# dashboard....
server {
    listen 80;
    server_name app.__DOMAIN__;
    root /var/www/voyagerota/current/app;
    include /etc/nginx/snippets/voyagerota-static.conf;
}

# core api for the dashboard and the devices....
server {
    listen 80;
    server_name api.__DOMAIN__;

    # firmware is at most 8 MB, a little room for the form fields....
    client_max_body_size 9m;

    location / {
        limit_req zone=voyager_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # slow boards on weak wifi still get their whole firmware....
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
